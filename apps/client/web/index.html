<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EVENTUAL: encuentros, comunidad y planificación de eventos del Club de Suboficiales. Demo interactiva.">
  <meta name="theme-color" content="#183e32">
  <link rel="icon" type="image/svg+xml" href="brand.svg">
  <link rel="manifest" href="manifest.json">
  <title>EVENTUAL · Club de Suboficiales</title>
  <style>html,body{margin:0;background:#f6f7f2}#loading{height:100dvh;display:grid;place-content:center;gap:18px;text-align:center;font:16px system-ui;color:#183e32}#loading strong{font-size:30px;letter-spacing:4px}#loading span{color:#64736a}#loading i{margin:auto;width:25px;height:25px;border:3px solid #d4eca5;border-top-color:#183e32;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#loading i{animation:none}}</style>
</head>
<body>
  <div id="loading" role="status"><strong>EVENTUAL</strong><span>Preparando nuestro próximo encuentro…</span><i aria-hidden="true"></i></div>
  <noscript>Activa JavaScript para explorar la demo de EVENTUAL.</noscript>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
