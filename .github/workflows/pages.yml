name: Publicar EVENTUAL web

on:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.6'
          path: flutter-sdk
          persist-credentials: false
      - name: Configurar Flutter
        run: echo "$GITHUB_WORKSPACE/flutter-sdk/bin" >> "$GITHUB_PATH"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Compilar web
        working-directory: apps/client
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --no-wasm-dry-run --base-href "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
