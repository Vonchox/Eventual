name: Compilar EVENTUAL para Android y Windows

on:
  push:
    branches: [main]
    paths:
      - apps/client/**
      - .github/workflows/native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.6'
          path: flutter-sdk
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Flutter
        run: echo "$GITHUB_WORKSPACE/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Compilar APK de prueba
        working-directory: apps/client
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Eventual-Android-APK
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.6'
          path: flutter-sdk
          persist-credentials: false
      - name: Configurar Flutter
        shell: pwsh
        run: Join-Path $env:GITHUB_WORKSPACE 'flutter-sdk/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compilar aplicación Windows
        working-directory: apps/client
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Eventual-Windows-x64
          path: apps/client/build/windows/x64/runner/Release/
          if-no-files-found: error
